name: CI and deploy dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: smarthome-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          load: true
          push: false
          tags: smarthome-frontend-web:ci
      - name: Smoke test frontend container
        shell: bash
        run: |
          docker run --detach --name smarthome-frontend-web-ci --publish 127.0.0.1:18080:8080 smarthome-frontend-web:ci
          trap 'docker rm --force smarthome-frontend-web-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 18); do
            state="$(docker inspect --format '{{.State.Status}}' smarthome-frontend-web-ci)"
            if [ "$state" != "running" ]; then docker logs smarthome-frontend-web-ci; exit 1; fi
            health="$(docker inspect --format '{{.State.Health.Status}}' smarthome-frontend-web-ci)"
            if [ "$health" = "healthy" ]; then break; fi
            if [ "$health" = "unhealthy" ]; then docker logs smarthome-frontend-web-ci; exit 1; fi
            sleep 5
          done
          if [ "$health" != "healthy" ]; then docker inspect smarthome-frontend-web-ci; docker logs smarthome-frontend-web-ci; exit 1; fi
          curl --fail --silent --show-error http://127.0.0.1:18080/ --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/dashboard --output /dev/null

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smarthome-frontend-web:dev
            ghcr.io/${{ github.repository_owner }}/smarthome-frontend-web:${{ github.sha }}

  deploy:
    if: ${{ false }} # Enable only after the VPS backup and restore audit is complete.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DOKPLOY_DEPLOY_WEBHOOK"
          curl --fail --silent --show-error --request POST "$DOKPLOY_DEPLOY_WEBHOOK" --output /dev/null
      - name: Verify deployment health
        env:
          DEPLOYMENT_HEALTH_URL: ${{ secrets.DEPLOYMENT_HEALTH_URL }}
        run: |
          test -n "$DEPLOYMENT_HEALTH_URL"
          for attempt in $(seq 1 36); do
            if curl --fail --silent "$DEPLOYMENT_HEALTH_URL" --output /dev/null; then exit 0; fi
            sleep 10
          done
          echo "Deployment health check did not pass within 6 minutes."
          exit 1
